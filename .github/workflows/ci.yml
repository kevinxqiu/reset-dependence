name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-analysis.txt
            requirements-croissant.txt

      - name: Install the analysis requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-analysis.txt

      - name: Compile every script
        run: python -m compileall -q scripts

      - name: Run the --help of the entry-point scripts
        run: |
          python scripts/camera_ready_numbers.py --help
          python scripts/check_numbers.py --help
          python scripts/fetch_unimal_assets.py --help
          python scripts/figures/make_figures.py --help

      - name: Validate the Croissant metadata
        # mlcroissant 1.1.1 needs pandas below 3, so it gets its own environment.
        run: |
          python -m venv .venv-croissant
          .venv-croissant/bin/pip install -r requirements-croissant.txt
          .venv-croissant/bin/mlcroissant validate --jsonld dataset/croissant.json

  numbers:
    name: Recompute the paper's numbers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-analysis.txt

      - name: Install the analysis requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-analysis.txt

      - name: Download and unzip the run summaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.1.2 --repo "$GITHUB_REPOSITORY" --pattern runs.zip
          unzip -q runs.zip

      - name: Run the numbers script
        run: >-
          python scripts/camera_ready_numbers.py --no-physics
          --out-json "$RUNNER_TEMP/numbers.json" --out-md "$RUNNER_TEMP/numbers.md"

      - name: Compare with the recorded values
        # physics.* rows need the UNIMAL XML files, and logs.* and panels.* rows need logs.zip and
        # panels.zip. This job fetches none of them, so check_numbers.py counts those rows as skipped.
        run: python scripts/check_numbers.py "$RUNNER_TEMP/numbers.json"
